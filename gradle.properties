org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
# AGP 9 otherwise creates only debug unit tests; CI verifies release as well.
android.onlyEnableUnitTestForTheTestedBuildType=false
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Explicit JDK locations supplied by the Nix shell and actions/setup-java.
org.gradle.java.installations.fromEnv=JAVA_HOME,JDK17_HOME,JDK21_HOME,JAVA_HOME_17_X64,JAVA_HOME_21_X64
