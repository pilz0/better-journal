# Detekt configuration.
#
# Built by extending the upstream defaults (`buildUponDefaultConfig = true`
# in `app/build.gradle.kts`). Only override values that need to differ from
# the default ruleset; the full default config is documented at
# https://detekt.dev/docs/rules/.
build:
  maxIssues: 0
  excludeCorrectable: false

console-reports:
  active: true

complexity:
  active: true
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  ComplexCondition:
    threshold: 6
  CyclomaticComplexMethod:
    threshold: 25
  TooManyFunctions:
    active: false
  NestedBlockDepth:
    threshold: 6
  MethodOverloading:
    active: false

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true

style:
  active: true
  MagicNumber:
    # Compose code uses many magic numbers (durations, dp values, indices) that
    # would be noisy to suppress one by one.
    active: false
  ReturnCount:
    max: 6
  WildcardImport:
    active: true
  UnusedPrivateMember:
    active: true
    ignoreAnnotated:
      - "Preview"
  UnusedImports:
    active: true
  MaxLineLength:
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
  ForbiddenComment:
    active: false
  CollapsibleIfStatements:
    active: true
  DataClassShouldBeImmutable:
    active: true
    excludes:
      - "**/data/room/**"
      - "**/data/export/**"
  NoTabs:
    active: true
  OptionalUnit:
    active: true
  RedundantVisibilityModifierRule:
    active: true
  UntilInsteadOfRangeTo:
    active: true
  ForbiddenImport:
    active: true
    imports:
      - "androidx.compose.runtime.collectAsState"
      - "androidx.hilt.navigation.compose.hiltViewModel"
      - "kotlinx.coroutines.GlobalScope"
      - "com.isaakhanimann.journal.*"

naming:
  active: true
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated:
      - "Composable"
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][_A-Z0-9]*"

empty-blocks:
  active: true

exceptions:
  active: true
  NotImplementedDeclaration:
    active: true
  ThrowingExceptionInMain:
    active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true

# Formatting is ktfmt's job (treefmt, `nix flake check`), so detekt's ktlint
# `formatting` rule set is not used.

potential-bugs:
  active: true
  UnsafeCast:
    active: true
  CastToNullableType:
    active: true
  MissingPackageDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true

performance:
  active: true
  UnnecessaryPartOfBinaryExpression:
    active: true

# Compose-specific advice — built-ins from Detekt 1.23.x are enabled via the
# default config and `config/lint/lint.xml` enforces Compose Lint rules.
