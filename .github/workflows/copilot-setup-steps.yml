---
name: Copilot Setup Steps

# Run automatically when this file changes (so PRs can validate the setup), and
# allow manual runs from the Actions tab to verify the green path.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

# Deny all permissions by default; the job grants the minimum required.
permissions: {}

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by
  # the GitHub Copilot cloud agent.
  copilot-setup-steps:
    name: Copilot Setup Steps
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      # Needed for actions/checkout below; Copilot uses its own token for any
      # git operations it performs after setup completes.
      contents: read

    # Match the deterministic JVM defaults used by the rest of CI so any local
    # Gradle invocations the agent runs behave the same as the build workflow.
    env:
      TZ: 'UTC'
      LANG: 'en_US.UTF-8'

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validate the Gradle wrapper before invoking it, mirroring the
      # `wrapper-validation` job in build.yml. This mitigates wrapper-tampering
      # risk before any `./gradlew` command runs below.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          # The action's default also installs the legacy `tools` package,
          # which sdkmanager no longer offers.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Only allow cache writes from the trusted default branch, matching
          # build.yml. Untrusted PR runs use the cache read-only to avoid
          # cache-poisoning from forks.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Warm Gradle's dependency caches so the agent's first build/test/lint
      # invocation does not have to download Hilt, Compose, Room,
      # kotlinx-serialization, the JitPack `compose-markdown` artifact, etc.
      # `:app:dependencies` resolves the full configuration graph without
      # requiring keystores or running any application code.
      - name: Warm Gradle caches
        run: |
          ./gradlew --version --no-daemon
          ./gradlew help --no-daemon
          ./gradlew :app:dependencies --no-daemon
