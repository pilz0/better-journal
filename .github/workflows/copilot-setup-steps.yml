---
name: Copilot Setup Steps

# Run automatically when this file changes (so PRs can validate the setup), and
# allow manual runs from the Actions tab to verify the green path.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

# Deny all permissions by default; the job grants the minimum required.
permissions: {}

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by
  # the GitHub Copilot cloud agent.
  copilot-setup-steps:
    name: Copilot Setup Steps
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      # Needed for actions/checkout below; Copilot uses its own token for any
      # git operations it performs after setup completes.
      contents: read

    # Match the deterministic JVM defaults used by the rest of CI so any local
    # Gradle invocations the agent runs behave the same as the build workflow.
    env:
      TZ: 'UTC'
      LANG: 'en_US.UTF-8'

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validate the Gradle wrapper before invoking it, mirroring the
      # `wrapper-validation` job in build.yml. This mitigates wrapper-tampering
      # risk before any `./gradlew` command runs below.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The toolchain comes from the flake's devShell, the same one developers
      # get from `nix develop` / direnv. Its PATH and variables are exported to
      # the remaining steps and to the agent's session.
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            extra-allowed-uris = http:// https://

      - name: Load Nix dev shell
        run: |
          # The child shell expands these variables after entering the Nix environment.
          # shellcheck disable=SC2016
          nix develop --command bash -c '
            tr ":" "\n" <<< "$PATH" | grep "^/nix/store/" >> "$GITHUB_PATH"
            for v in JAVA_HOME ANDROID_HOME ANDROID_SDK_ROOT; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Only allow cache writes from the trusted default branch, matching
          # build.yml. Untrusted PR runs use the cache read-only to avoid
          # cache-poisoning from forks.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Warm Gradle's dependency caches so the agent's first build/test/lint
      # invocation does not have to download Hilt, Compose, Room,
      # kotlinx-serialization, the JitPack `compose-markdown` artifact, etc.
      # `:app:dependencies` resolves the full configuration graph without
      # requiring keystores or running any application code.
      - name: Warm Gradle caches
        run: |
          ./gradlew --version --no-daemon
          ./gradlew help --no-daemon
          ./gradlew :app:dependencies --no-daemon
