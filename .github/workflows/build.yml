---
name: Build and test
on:
  push:
  pull_request:

# Deny all permissions by default; each job grants the minimum required.
permissions: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  main_project_module: 'app'
  # Deterministic JVM defaults for tests.
  TZ: 'UTC'
  LANG: 'en_US.UTF-8'

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The wrapper validation lives inside the gradle/actions monorepo since v3.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  test:
    name: Run Unit Tests (${{ matrix.test-suite }})
    runs-on: ubuntu-latest
    needs: [ wrapper-validation ]
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - test-suite: data
            test-args: '--tests "foo.pilz.freaklog.data.*"'
          - test-suite: ui
            test-args: '--tests "foo.pilz.freaklog.ui.*"'
          - test-suite: misc
            # Run everything that is NOT in the data.* or ui.* packages so that
            # newly-added top-level (or other-package) tests are not silently
            # skipped by an overly narrow filter such as `Test*`.
            test-args: '-PtestExclude=foo.pilz.freaklog.data.*,foo.pilz.freaklog.ui.*'
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest ${{ matrix.test-args }} --no-daemon

      - name: Publish JUnit results
        # action-junit-report requires `checks: write`, but PRs from forks always get a
        # read-only GITHUB_TOKEN. Skip the check publication on fork PRs to avoid 403s;
        # the raw XML is still uploaded as an artifact in the next step.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: 'app/build/test-results/testDebugUnitTest/*.xml'
          check_name: Unit Test Results (${{ matrix.test-suite }})
          require_tests: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.test-suite }}
          path: |
            app/build/reports/tests/
            app/build/test-results/

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: [ wrapper-validation ]
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate Kover XML + HTML reports
        run: ./gradlew :app:koverXmlReportDebug :app:koverHtmlReportDebug --no-daemon

      # Fail the job if coverage falls below the threshold defined in app/build.gradle.kts.
      - name: Verify coverage thresholds
        run: ./gradlew :app:koverVerifyDebug --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/
            app/build/reports/kover/htmlDebug/

  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    needs: [ wrapper-validation ]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon

      - name: Upload Detekt SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: app/build/reports/detekt/detekt.sarif
          category: detekt
        # SARIF upload requires `security-events: write`, which is read-only on fork PRs;
        # tolerate that failure so fork PRs don't go red on the upload step alone.
        continue-on-error: true

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detekt-reports
          path: app/build/reports/detekt/

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    needs: [ wrapper-validation ]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload Lint SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint
        continue-on-error: true

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.*

  build-app:
    name: Build (${{ matrix.app-type }})
    runs-on: ubuntu-latest
    needs: [ wrapper-validation ]
    permissions:
      contents: read
    strategy:
      matrix:
        app-type: [ apk, aab ]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build APK
        if: matrix.app-type == 'apk'
        run: ./gradlew assembleRelease --no-daemon

      - name: Build AAB
        if: matrix.app-type == 'aab'
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload unsigned APK
        if: matrix.app-type == 'apk'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freaklog-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload unsigned AAB
        if: matrix.app-type == 'aab'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freaklog-unsigned-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  architecture-and-hygiene:
    name: Architecture & Hygiene
    runs-on: ubuntu-latest
    needs: [ wrapper-validation ]
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for upstream namespace leaks
        run: |
          if grep -rn "com\.isaakhanimann\.journal" app/src/main ; then
            echo "Error: Found legacy package references to com.isaakhanimann.journal in app/src/main"
            exit 1
          fi

      - name: Validate Room database schemas
        run: |
          python3 -c "
          import json, glob, sys
          schemas = glob.glob('app/schemas/foo.pilz.freaklog.data.room.AppDatabase/*.json')
          if not schemas:
              print('No Room schema files found!')
              sys.exit(1)
          if 'app/schemas/foo.pilz.freaklog.data.room.AppDatabase/27.json' not in schemas:
              print('Room schema v27 is missing!')
              sys.exit(1)
          for s in schemas:
              with open(s) as f:
                  data = json.load(f)
                  assert data.get('formatVersion') == 1, f'Invalid formatVersion in {s}'
          print(f'Successfully validated {len(schemas)} Room schema files.')
          "

      - name: Validate Substances dataset JSON
        run: |
          python3 -c "
          import json, sys
          with open('app/src/main/assets/Substances.json') as f:
              data = json.load(f)
          substances = data.get('substances', [])
          categories = data.get('categories', [])
          assert len(substances) >= 100, f'Expected >= 100 substances, found {len(substances)}'
          assert len(categories) > 0, 'Categories list is empty'
          print(f'Validated Substances.json: {len(substances)} substances across {len(categories)} categories.')
          "

      - name: Verify workflow security invariants
        run: |
          for wf in .github/workflows/*.yml; do
            grep -q 'permissions: {}' "$wf" || {
              echo "Error: $wf missing deny-all permissions: {}"
              exit 1
            }
            grep -q 'step-security/harden-runner' "$wf" || {
              echo "Error: $wf missing step-security/harden-runner"
              exit 1
            }
          done
          echo "All workflows passed security invariants."

  nix-checks:
    name: Nix Flake Invariant Checks
    runs-on: ubuntu-latest
    needs: [ wrapper-validation ]
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            extra-allowed-uris = http:// https://

      - name: Run Nix flake checks
        run: nix flake check

  build-test-fixtures:
    name: Build Test Fixtures (androidTest APK)
    runs-on: ubuntu-latest
    needs: [ wrapper-validation ]
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Assemble Debug AndroidTest APK
        run: ./gradlew assembleDebugAndroidTest --no-daemon

  # Aggregator job whose status can be used as a single required check in
  # branch protection.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [ wrapper-validation, test, coverage, detekt, lint, build-app, architecture-and-hygiene, nix-checks, build-test-fixtures ]
    if: always()
    permissions: {}
    steps:
      - name: Verify all upstream jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
