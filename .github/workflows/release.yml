---
# Sign and publish release artifacts.
#
# This workflow is intentionally split from `build.yml` so that pull-request
# builds (which do NOT receive secrets) cannot ever execute steps that handle
# the signing key, Cloudflare R2 credentials, or the Google Play service
# account. It is only ever triggered by:
#   1. A successful `Build and test` workflow run on `refs/heads/main`, or a
#      tagged push (handled by the `workflow_run` trigger), AND
#   2. Manually via `workflow_dispatch`.
#
# Secret-consuming jobs are pinned to GitHub Environments (`internal-track`,
# `production`) so that the repository owner can require manual approval and
# scope secrets per environment.
name: Sign and publish

on:
  workflow_run:
    workflows: [ "Build and test" ]
    types: [ completed ]
    # Note: do NOT use `branches:` here. The `branches` filter only matches
    # the upstream run's `head_branch` against branch names — for tag pushes,
    # `head_branch` is the tag short name (e.g. `v1.2.3`), not a branch, so a
    # `branches: [ main ]` filter would silently drop every tag release. The
    # `preconditions` job below performs the actual gating using the API.
  workflow_dispatch:
    inputs:
      upstream-run-id:
        description: >-
          Run ID of the `Build and test` workflow whose unsigned artifacts
          should be signed and released. Find it in the URL of the run page
          (e.g. https://github.com/<owner>/<repo>/actions/runs/<RUN_ID>).
        required: true
        type: string

# Deny all permissions by default; each job grants the minimum required.
permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.workflow_run.head_sha || inputs.upstream-run-id }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # STAGE 1: APEX & RELEASE CONTEXT PRECONDITIONS
  # =========================================================================
  preconditions:
    name: Check release preconditions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      upstream-run-id: ${{ steps.resolve.outputs.upstream-run-id }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      is-tag: ${{ steps.resolve.outputs.is-tag }}
      should-release: ${{ steps.resolve.outputs.should-release }}
      tag-name: ${{ steps.resolve.outputs.tag-name }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - id: resolve
        name: Resolve upstream run + tag context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ inputs.upstream-run-id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_id="$DISPATCH_RUN_ID"
          else
            run_id="$WORKFLOW_RUN_ID"
          fi

          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Invalid run ID" >&2; exit 1; }

          run_json="$(gh api "/repos/$GH_REPO/actions/runs/$run_id")"
          head_branch="$(jq -r '.head_branch' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"

          if [ "$conclusion" != "success" ]; then
            echo "::error::Upstream run $run_id did not succeed (conclusion=$conclusion)" >&2
            exit 1
          fi

          build_workflow_id="$(gh api "/repos/$GH_REPO/actions/workflows/build.yml" --jq .id)"
          if ! jq -e --arg repo "$GH_REPO" --argjson workflow "$build_workflow_id" '
            .event == "push" and .status == "completed" and
            .head_repository.full_name == $repo and .workflow_id == $workflow
          ' <<<"$run_json" >/dev/null; then
            echo "::error::Upstream run is not a trusted repository push build" >&2
            exit 1
          fi

          default_branch="$(gh api "/repos/$GH_REPO" --jq .default_branch)"

          is_tag=false
          if gh api "/repos/$GH_REPO/git/refs/tags/$head_branch" >/dev/null 2>&1; then
            tag_sha="$(gh api "/repos/$GH_REPO/git/refs/tags/$head_branch" --jq .object.sha)"
            if [ "$tag_sha" = "$head_sha" ]; then
              is_tag=true
            else
              tag_obj="$(gh api "/repos/$GH_REPO/git/tags/$tag_sha" 2>/dev/null || true)"
              if [ -n "$tag_obj" ] && [ "$(jq -r '.object.sha' <<<"$tag_obj")" = "$head_sha" ]; then
                is_tag=true
              fi
            fi
          fi

          if [ "$is_tag" != "true" ] && [ "$head_branch" != "$default_branch" ]; then
            echo "::notice::Skipping release: head_branch=$head_branch is neither the default branch ($default_branch) nor a tag."
            {
              echo "should-release=false"
              echo "upstream-run-id=$run_id"
              echo "head-sha=$head_sha"
              echo "is-tag=$is_tag"
              echo "tag-name="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should-release=true"
            echo "upstream-run-id=$run_id"
            echo "head-sha=$head_sha"
            echo "is-tag=$is_tag"
            echo "tag-name=$head_branch"
          } >> "$GITHUB_OUTPUT"

  # =========================================================================
  # STAGE 2: SIGNING PIPELINES (Build -> Verify pairs per format)
  # =========================================================================
  sign-apk:
    name: Sign Release APK
    needs: [ preconditions ]
    if: needs.preconditions.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download unsigned APK from upstream build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freaklog-unsigned-apk
          run-id: ${{ needs.preconditions.outputs.upstream-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK build-tools
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Sign APK artifact
        uses: ilharp/sign-android-release@13dd52242698526f951aa8bb8696204f6fea702a # v2.0.0
        id: sign
        with:
          releaseDir: .
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename signed APK
        env:
          SIGNED_FILE: ${{ steps.sign.outputs.signedFile }}
        run: |
          set -euo pipefail
          [[ -f "$SIGNED_FILE" && ! -L "$SIGNED_FILE" && "$SIGNED_FILE" != *$'\n'* ]]
          [[ "$SIGNED_FILE" == *.apk ]]
          [[ "$(dirname -- "$(realpath -- "$SIGNED_FILE")")" == "$PWD" ]]
          mv -- "$SIGNED_FILE" "freaklog.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freaklog-apk
          path: freaklog.apk
          if-no-files-found: error

  verify-signed-apk:
    name: Verify Signed APK
    needs: [ sign-apk ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freaklog-apk

      - name: Verify APK signature and integrity
        run: |
          [ -f "freaklog.apk" ] || { echo "freaklog.apk missing"; exit 1; }
          unzip -t freaklog.apk
          echo "APK size: $(stat -c%s freaklog.apk) bytes"

  sign-aab:
    name: Sign Release AAB
    needs: [ preconditions ]
    if: needs.preconditions.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    environment: signing
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download unsigned AAB from upstream build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freaklog-unsigned-aab
          run-id: ${{ needs.preconditions.outputs.upstream-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android SDK build-tools
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Sign AAB artifact
        uses: ilharp/sign-android-release@13dd52242698526f951aa8bb8696204f6fea702a # v2.0.0
        id: sign
        with:
          releaseDir: .
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename signed AAB
        env:
          SIGNED_FILE: ${{ steps.sign.outputs.signedFile }}
        run: |
          set -euo pipefail
          [[ -f "$SIGNED_FILE" && ! -L "$SIGNED_FILE" && "$SIGNED_FILE" != *$'\n'* ]]
          [[ "$SIGNED_FILE" == *.aab ]]
          [[ "$(dirname -- "$(realpath -- "$SIGNED_FILE")")" == "$PWD" ]]
          mv -- "$SIGNED_FILE" "freaklog.aab"

      - name: Upload signed AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freaklog-aab
          path: freaklog.aab
          if-no-files-found: error

  verify-signed-aab:
    name: Verify Signed AAB
    needs: [ sign-aab ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download signed AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freaklog-aab

      - name: Verify AAB structure
        run: |
          [ -f "freaklog.aab" ] || { echo "freaklog.aab missing"; exit 1; }
          unzip -t freaklog.aab
          echo "AAB size: $(stat -c%s freaklog.aab) bytes"

  # =========================================================================
  # STAGE 3: BUILD PROVENANCE & SUPPLY CHAIN ATTESTATION
  # =========================================================================
  attest:
    name: Attest build provenance
    needs: [ preconditions, verify-signed-apk, verify-signed-aab ]
    if: needs.preconditions.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download signed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: signed
          pattern: freaklog-*

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            signed/freaklog-apk/freaklog.apk
            signed/freaklog-aab/freaklog.aab

  # =========================================================================
  # STAGE 4: DISTRIBUTION & DEPLOYMENT CHANNELS
  # =========================================================================
  upload-r2-apk:
    name: Upload APK to Cloudflare R2
    needs: [ preconditions, attest ]
    if: needs.preconditions.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freaklog-apk
          path: apks

      - name: Upload APK to R2
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317 # v1.5
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: apks
          destination-dir: apks
          keep-file-fresh: true

  upload-r2-aab:
    name: Upload AAB to Cloudflare R2
    needs: [ preconditions, attest ]
    if: needs.preconditions.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download signed AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freaklog-aab
          path: aabs

      - name: Upload AAB to R2
        uses: ryand56/r2-upload-action@33ebb7a494b3a8a3c5ed2ea6bbdc72e707090317 # v1.5
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: aabs
          destination-dir: aabs
          keep-file-fresh: true

  upload-google-play:
    name: Upload to Google Play (Internal track)
    needs: [ preconditions, attest ]
    if: needs.preconditions.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    environment: internal-track
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download signed AAB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freaklog-aab
          path: app

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: foo.pilz.freaklog
          releaseFiles: app/freaklog.aab
          tracks: internal

  # =========================================================================
  # STAGE 5: GITHUB RELEASE PUBLICATION
  # =========================================================================
  create-release:
    name: Publish GitHub Release
    needs: [ preconditions, attest, upload-r2-apk, upload-r2-aab, upload-google-play ]
    if: needs.preconditions.outputs.is-tag == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download signed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .
          pattern: freaklog-*

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.preconditions.outputs.tag-name }}
          files: |
            freaklog-apk/freaklog.apk
            freaklog-aab/freaklog.aab
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true

  # =========================================================================
  # STAGE 6: FINALIZE RELEASE ROLLUP
  # =========================================================================
  finalize-release:
    name: Finalize release
    needs: [ create-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Announce release completion
        run: |
          echo "========================================================="
          echo "          RELEASE PUBLICATION COMPLETED                  "
          echo "========================================================="
          echo "Artifacts signed, attested, and published to all targets."
